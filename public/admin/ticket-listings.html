<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
        BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
        SEO
    =========================================== -->

    <title>

        TicketFussion Admin | Ticket Listings

    </title>

    <meta name="description"
          content="TicketFussion Administration Panel">

    <meta name="robots"
          content="noindex,nofollow">

    <!-- ==========================================
        FAVICON
    =========================================== -->

    <link rel="icon"
          href="/assets/logos/favicon.png">

    <!-- ==========================================
        CSS
    =========================================== -->

    <link rel="stylesheet"
          href="/css/reset.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

    <link rel="stylesheet"
          href="/css/theme.css">

    <link rel="stylesheet"
          href="/css/admin.css">

    <link rel="stylesheet"
          href="/css/events.css">

    <link rel="stylesheet"
          href="/css/top-bar.css">

</head>

<body>
    <div class="admin-wrapper">

    <!-- =====================================================
        SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <a href="ticket-listings.html"
           class="admin-logo">

            <img src="/assets/logos/logo.png"
                 alt="TicketFussion">

        </a>

        <nav>

            <ul>

                <li>

                    <a href="events.html"
                       class="active">

                        Events

                    </a>

                </li>

                <li>

                    <a href="occurrences.html">

                        Occurrences

                    </a>

                </li>

                <li>

                    <a href="ticket-listings.html">

                        Ticket Listings

                    </a>

                </li>

            </ul>

        </nav>

    </aside>

<!-- =====================================================
    MAIN
====================================================== -->

<main class="admin-main">

    <!-- ======================================
        TOP BAR
    ======================================= -->

    <header class="admin-header">

        <div class="page-title">

            <h1>Ticket Listings</h1>

            <p>Create, edit and publish ticket listings.</p>

        </div>

        <div class="admin-user">

            <div class="admin-avatar">

                A

            </div>

            <div class="admin-details">

                <span id="admin-name">

                    Administrator

                </span>

            </div>

            <button
                id="logout-btn"
                class="logout-btn">

                Logout

            </button>

        </div>

    </header>
    
 <!-- ======================================
        CONTENT
======================================= -->
    
<section class="page-content">

<form id="ticket-listing-form">

    <h2>Ticket Information</h2>

    <div class="form-grid">

        <div class="form-group">

            <label for="occurrence_id">

                Occurrence

            </label>

            <select
                id="occurrence_id"
                required>

                <option value="">

                    Loading occurrences...

                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="ticket_type">

                Ticket Type

            </label>

            <input
                id="ticket_type"
                type="text"
                placeholder="VIP, General Admission"
                required>

        </div>

        <div class="form-group">

            <label for="section">

                Section

            </label>

            <input
                id="section"
                type="text"
                placeholder="Section A">

        </div>

        <div class="form-group">

            <label for="row">

                Row

            </label>

            <input
                id="row"
                type="text"
                placeholder="Row 5">

        </div>

        <div class="form-group">

            <label for="seats">

                Seat(s)

            </label>

            <input
                id="seats"
                type="text"
                placeholder="A12,A13">

        </div>

        <div class="form-group">

            <label for="quantity">

                Quantity

            </label>

            <input
                id="quantity"
                type="number"
                min="1"
                value="1"
                required>

        </div>

        <div class="form-group">

            <label for="price">

                Price (USD)

            </label>

            <input
                id="price"
                type="number"
                step="0.01"
                required>

        </div>

        <div class="form-group">

            <label for="delivery_method">

                Delivery Method

            </label>

            <select id="delivery_method">

                <option value="E-ticket">

                    E-ticket

                </option>

                <option value="Mobile Ticket">

                    Mobile Ticket

                </option>

                <option value="PDF Ticket">

                    PDF Ticket

                </option>

                <option value="Physical Ticket">

                    Physical Ticket

                </option>

            </select>

        </div>

    </div>

    <div class="form-actions">

        <button
            type="reset"
            class="btn btn-outline">

            Clear

        </button>

        <button
            type="submit"
            class="btn btn-primary">

            Publish Ticket Listing

        </button>

    </div>

</form>

</section>

</main>

</div>

<!-- =====================================================
    JAVASCRIPT
====================================================== -->
<script src="admin-auth.js"></script>
<script src="ticket-listings.js"></script>

</body>

</html>
