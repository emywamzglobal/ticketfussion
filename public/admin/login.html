<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
        BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
        SEO
    =========================================== -->

    <title>

        TicketFussion Admin | Events

    </title>

    <meta name="description"
          content="TicketFussion Administration Panel">

    <meta name="robots"
          content="noindex,nofollow">

    <!-- ==========================================
        FAVICON
    =========================================== -->

    <link rel="icon"
          href="/assets/logos/favicon.png">

    <!-- ==========================================
        CSS
    =========================================== -->

    <link rel="stylesheet"
          href="/css/reset.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

    <link rel="stylesheet"
          href="/css/theme.css">

    <link rel="stylesheet"
          href="/css/admin.css">

    <link rel="stylesheet"
          href="/css/events.css">

    <link rel="stylesheet"
          href="/css/top-bar.css">

</head>

<body>

<!-- =====================================================
    ADMIN WRAPPER
====================================================== -->

<div class="admin-wrapper">

    <!-- =====================================================
        SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <a href="events.html"
           class="admin-logo">

            <img src="/assets/logos/logo.png"
                 alt="TicketFussion">

        </a>

        <nav>

            <ul>

                <li>

                    <a href="events.html"
                       class="active">

                        Events

                    </a>

                </li>

                <li>

                    <a href="occurrences.html">

                        Occurrences

                    </a>

                </li>

                <li>

                    <a href="ticket-listings.html">

                        Ticket Listings

                    </a>

                </li>

                <li>

                    <a href="login.html">

                        Login

                    </a>

                </li>

            </ul>

        </nav>

    </aside>

    <!-- =====================================================
        MAIN
    ====================================================== -->

    <main class="admin-main login-page">

    <section class="page-content">

        <form id="login-form" class="card login-card">

            <h1>

                Administrator Login

            </h1>

            <p>

                Sign in to access the TicketFussion Admin Panel.

            </p>

            <div class="form-group">

                <label>

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@ticketfussion.com"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Login

                </button>

            </div>

        </form>

    </section>

</main>

</div>

<!-- =====================================================
    JAVASCRIPT
====================================================== -->

<script src="js/admin.js"></script>

<script src="js/events.js"></script>

</body>

</html>
