<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
        BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
        SEO
    =========================================== -->

    <title>

        TicketFussion Admin | Occurrences

    </title>

    <meta name="description"
          content="TicketFussion Administration Panel">

    <meta name="robots"
          content="noindex,nofollow">

    <!-- ==========================================
        FAVICON
    =========================================== -->

    <link rel="icon"
          href="/assets/logos/favicon.png">

    <!-- ==========================================
        CSS
    =========================================== -->

    <link rel="stylesheet"
          href="/css/reset.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

    <link rel="stylesheet"
          href="/css/theme.css">

    <link rel="stylesheet"
          href="/css/admin.css">

    <link rel="stylesheet"
          href="/css/events.css">

    <link rel="stylesheet"
          href="/css/top-bar.css">

</head>

<body>
    <div class="admin-wrapper">

    <!-- =====================================================
        SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <a href="occurrences.html"
           class="admin-logo">

            <img src="/assets/logos/logo.png"
                 alt="TicketFussion">

        </a>

        <nav>

            <ul>

                <li>

                    <a href="events.html"
                       class="active">

                        Events

                    </a>

                </li>

                <li>

                    <a href="occurrences.html"
                       class="active">

                        Occurrences

                    </a>

                </li>

                <li>

                    <a href="ticket-listings.html">

                        Ticket Listings

                    </a>

                </li>


            </ul>

        </nav>

    </aside>

<!-- =====================================================
    MAIN
====================================================== -->

<main class="admin-main">

    <!-- ======================================
        TOP BAR
    ======================================= -->

    <header class="admin-header">

        <div class="page-title">

            <h1>Occurrences</h1>

            <p>Create, edit and publish occurrences.</p>

        </div>

        <div class="admin-user">

            <div class="admin-avatar">

                A

            </div>

            <div class="admin-details">

                <span id="admin-name">

                    Administrator

                </span>

            </div>

            <button
                id="logout-btn"
                class="logout-btn">

                Logout

            </button>

        </div>

    </header>

    <!-- ======================================
        PAGE CONTENT
    ======================================= -->

    <section class="page-content">

    <form id="occurrence-form">

        <h2>Occurrence Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label for="venue_layout">Venue Banner</label>
                <input
                    type="file"
                    id="venue_layout"
                    accept="image/*">
            </div>

            <div class="form-group">
                <label for="event_id">Event</label>
                <select id="event_id" required>
                    <option value="">Loading events...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="venue">Venue</label>
                <input
                    type="text"
                    id="venue"
                    placeholder="Venue Name"
                    required>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input
                    type="text"
                    id="city"
                    placeholder="City"
                    required>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input
                    type="text"
                    id="country"
                    placeholder="Country"
                    required>
            </div>

            <div class="form-group">
                <label for="event_date">Event Date</label>
                <input
                    type="date"
                    id="event_date"
                    required>
            </div>

            <div class="form-group">
                <label for="event_time">Event Time</label>
                <input
                    type="time"
                    id="event_time"
                    required>
            </div>

            <div class="form-group">
                 <label for="timezone">Timezone</label>

                 <input
                   type="text"
                   id="timezone-search"
                   placeholder="Search timezone..."
                   autocomplete="off"
                >

                <select id="timezone" required>
                <option value="">Select Timezone</option>
                </select>
            </div>

            <div class="form-group">
                <label for="about_event">About Event</label>
                <textarea
                    id="about_event"
                    rows="5"
                    placeholder="About this occurrence..."></textarea>
            </div>

            <div class="form-group">
                <label for="event_gallery">Event Gallery</label>
                <input
                    type="file"
                    id="event_gallery"
                    multiple
                    accept="image/*">
            </div>

            <div class="form-group">
                <label for="event_information">Event Information</label>
                <textarea
                    id="event_information"
                    rows="5"
                    placeholder="Extra event information..."></textarea>
            </div>

            <div class="form-group">
                <label for="venue_information">Venue Information</label>
                <textarea
                    id="venue_information"
                    rows="5"
                    placeholder="Venue details..."></textarea>
            </div>

        </div>

        <div class="form-actions">

            <button
                type="reset"
                class="btn btn-outline">
                Clear
            </button>

            <button
                type="submit"
                class="btn btn-primary">
                Publish Occurrence
            </button>

        </div>

    </form>

    <hr class="admin-divider">

<section class="admin-list-section">

    <h2>Published Occurrences</h2>

    <div id="occurrences-list">

        Loading occurrences...

    </div>

</section>

</section>

</main>

</div>

<!-- =====================================================
    JAVASCRIPT
====================================================== -->
<script src="admin-auth.js"></script>
<script src="occurrences.js"></script>

</body>

</html>
