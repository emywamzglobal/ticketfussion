<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
        BASIC META
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
        SEO
    =========================================== -->

    <title>

        TicketFussion Admin | Events

    </title>

    <meta name="description"
          content="TicketFussion Administration Panel">

    <meta name="robots"
          content="noindex,nofollow">

    <!-- ==========================================
        FAVICON
    =========================================== -->

    <link rel="icon"
          href="/assets/logos/favicon.png">

    <!-- ==========================================
        CSS
    =========================================== -->

    <link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/top-bar.css">

</head>

<body>
    <div class="admin-wrapper">

    <!-- =====================================================
        SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <a href="events.html"
           class="admin-logo">

            <img src="/assets/logos/logo.png"
                 alt="TicketFussion">

        </a>

        <nav>

            <ul>

                <li>

                    <a href="events.html"
                       class="active">

                        Events

                    </a>

                </li>

                <li>

                    <a href="occurrences.html">

                        Occurrences

                    </a>

                </li>

                <li>

                    <a href="ticket-listings.html">

                        Ticket Listings

                    </a>

                </li>
            </ul>
        </nav>

    </aside>

<!-- =====================================================
    MAIN
====================================================== -->

<main class="admin-main">

    <!-- ======================================
        TOP BAR
    ======================================= -->

    <header class="admin-header">

        <div class="page-title">

            <h1>Events</h1>

            <p>Create, edit and publish events.</p>

        </div>

        <div class="admin-user">

            <div class="admin-avatar">

                A

            </div>

            <div class="admin-details">

                <span id="admin-name">

                    Administrator

                </span>

            </div>

            <button
                id="logout-btn"
                class="logout-btn">

                Logout

            </button>

        </div>

    </header>

    <!-- ======================================
        CONTENT
    ======================================= -->
    
    <section class="page-content">

        <form id="event-form">

            <div class="card">

                <h2>Basic Information</h2>

                <div class="form-grid">

                    <!-- Hero Banner -->
                    <div class="form-group">
                        <label for="banner_image">Hero Banner</label>

                        <input
                            id="banner_image"
                            name="banner_image"
                            type="file"
                            accept="image/*">
                    </div>

                    <!-- Event Name -->
                    <div class="form-group">
                        <label for="title">Event Name</label>

                        <input
                            id="title"
                            name="title"
                            type="text"
                            placeholder="Event Name"
                            required>
                    </div>

                    <!-- Category -->
                    <div class="form-group">
                        <label for="category">Category</label>

                        <select
                            id="category"
                            name="category"
                            required>

                            <option value="">Select Category</option>
                            <option value="Concert">Concert</option>
                            <option value="Sports">Sports</option>
                            <option value="Theatre">Theatre</option>
                            <option value="Comedy">Comedy</option>

                        </select>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description">
                            Short Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="Appears on Home Page"
                            required></textarea>
                    </div>

                </div>

            </div>

            <div class="form-actions">

                <button
                    class="btn btn-outline"
                    type="button">

                    Save Draft

                </button>

                <button
                    class="btn btn-primary"
                    type="submit">

                    Publish Event

                </button>

            </div>

        </form>

    </section>

</main>

</div>

<!-- =====================================================
    JAVASCRIPT
====================================================== -->
<script src="admin-auth.js"></script>
<script src="events.js"></script>

</body>

</html>
